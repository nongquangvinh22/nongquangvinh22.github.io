name: Build StoryDraw AI Android APK

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-storydraw-android.yml'
      - 'projects/storydraw-android-source-*.b64'
  workflow_dispatch:

permissions:
  contents: write

env:
  PROJECT_DIR: projects/storydraw-android

jobs:
  build:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Android project source
        shell: bash
        run: |
          cat projects/storydraw-android-source-*.b64 | base64 --decode > /tmp/storydraw-android.tar.xz
          mkdir -p "$PROJECT_DIR"
          tar -xJf /tmp/storydraw-android.tar.xz -C "$PROJECT_DIR"
          test -f "$PROJECT_DIR/app/src/main/java/com/nqv/storydraw/MainActivity.kt"
          test -f "$PROJECT_DIR/app/src/main/java/com/nqv/storydraw/VideoPipeline.kt"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon assembleDebug

      - name: Upload APK as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: StoryDraw-AI-MVP-0.1.0-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: storydraw-android-mvp-${{ github.run_number }}
          name: StoryDraw AI Android MVP 0.1.0 · Build ${{ github.run_number }}
          body: |
            APK thử nghiệm StoryDraw AI cho Android/vivo X200 Pro.

            Lưu ý: bản 0.1 dựng video từ ảnh người dùng chọn; chưa sinh tranh AI tự động. Hiệu ứng từng nét là mô phỏng đường biên ảnh. Xem README trong mã nguồn trước khi cài.
          files: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
          fail_on_unmatched_files: true
