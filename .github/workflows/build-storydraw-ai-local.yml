name: Build StoryDraw AI Local Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-storydraw-ai-local.yml'
      - 'projects/storydraw-ai-local-source-*.b64'

permissions:
  contents: write

jobs:
  build:
    name: Build MNN runtime and StoryDraw APK (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out StoryDraw project archive
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "Cannot find sdkmanager under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Install Android platform, NDK and CMake
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;27.2.12479018' \
            'cmake;3.22.1'
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_PATH"

      - name: Reconstruct StoryDraw Android project
        shell: bash
        run: |
          cat projects/storydraw-ai-local-source-*.b64 | base64 --decode > /tmp/storydraw-ai-local.tar.xz
          mkdir -p projects/storydraw-ai-local
          tar -xJf /tmp/storydraw-ai-local.tar.xz -C projects/storydraw-ai-local
          test -f projects/storydraw-ai-local/app/src/main/java/com/nqv/storydraw/MainActivity.kt
          test -f projects/storydraw-ai-local/app/src/main/cpp/diffusion_jni.cpp
          test -f projects/storydraw-ai-local/app/build.gradle.kts

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fetch pinned Alibaba MNN source
        shell: bash
        run: |
          git init MNN
          git -C MNN remote add origin https://github.com/alibaba/MNN.git
          git -C MNN fetch --depth=1 origin a5c3dd91fe4509aea0d27cec80dc44f7f2d636d7
          git -C MNN checkout --detach FETCH_HEAD
          git -C MNN submodule update --init --recursive --depth 1

      - name: Build MNN Android arm64 with Diffusion, CLIP tokenizer and OpenCL
        shell: bash
        run: |
          cd MNN/project/android
          mkdir -p build_64
          cd build_64
          # Reduce parallelism to avoid exhausting the free GitHub runner memory.
          sed -i 's/make -j4/make -j2/' ../build_64.sh
          MNN_FLAGS="-DMNN_BUILD_LLM=ON -DMNN_BUILD_DIFFUSION=ON -DMNN_OPENCL=ON -DMNN_LLM_BUILD_DEMO=OFF -DMNN_SEP_BUILD=OFF -DMNN_LOW_MEMORY=ON -DMNN_SUPPORT_TRANSFORMER_FUSE=ON -DMNN_BUILD_TEST=OFF -DMNN_BUILD_BENCHMARK=OFF -DMNN_BUILD_DEMO=OFF -DMNN_BUILD_TOOLS=OFF -DMNN_USE_LOGCAT=ON -DMNN_BUILD_OPENCV=ON -DMNN_IMGCODECS=ON -DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,max-page-size=16384 -DCMAKE_INSTALL_PREFIX=."
          bash ../build_64.sh "$MNN_FLAGS"
          find . -name 'libMNN.so' -type f -print -quit | grep -q 'libMNN.so'
          # MNN is linked as one shared library because SEP_BUILD is OFF.

      - name: Stage MNN shared libraries into Android app
        shell: bash
        run: |
          APP=projects/storydraw-ai-local/app
          MNN_LIB="$(find MNN/project/android/build_64 -name libMNN.so -type f | head -n 1)"
          test -n "$MNN_LIB"
          LIB_DIR="$(dirname "$MNN_LIB")"
          mkdir -p "$APP/src/main/jniLibs/arm64-v8a"
          find "$LIB_DIR" -maxdepth 1 -name '*.so' -type f -exec cp -v {} "$APP/src/main/jniLibs/arm64-v8a/" \;
          test -f "$APP/src/main/jniLibs/arm64-v8a/libMNN.so"
          ls -lh "$APP/src/main/jniLibs/arm64-v8a"

      - name: Add verified CLIP ViT-L/14 tokenizer for MNN Diffusion
        shell: bash
        run: |
          mkdir -p projects/storydraw-ai-local/app/src/main/assets/sd15
          curl --fail --location --retry 5 --retry-all-errors \
            'https://raw.githubusercontent.com/PickleHik3/termux-launcher/67794593008a8b4e6cac1274085aaeb9347d1976/app/src/main/assets/tai-diffusion/clip-vit-l14.tokenizer.mtok' \
            -o projects/storydraw-ai-local/app/src/main/assets/sd15/tokenizer.mtok
          test "$(stat -c%s projects/storydraw-ai-local/app/src/main/assets/sd15/tokenizer.mtok)" -gt 500000
          head -c 32 projects/storydraw-ai-local/app/src/main/assets/sd15/tokenizer.mtok

      - name: Build StoryDraw AI APK
        shell: bash
        run: |
          cd projects/storydraw-ai-local
          gradle --no-daemon --stacktrace -PmnnRoot="$GITHUB_WORKSPACE/MNN" assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StoryDraw-AI-Local-v0.2.0-APK
          path: projects/storydraw-ai-local/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: storydraw-ai-local-v0.2.0-build-${{ github.run_number }}
          name: StoryDraw AI Local 0.2.0 · Build ${{ github.run_number }}
          prerelease: true
          body: |
            StoryDraw AI Android Local MVP 0.2.0.

            This version is intended to generate illustrations with MNN Stable Diffusion 1.5 locally on-device after a one-time ~1.15 GB model download. No paid inference API is used.

            Important: not yet benchmarked on vivo X200 Pro. Character identity is prompt-guided, not guaranteed. Brush drawing is a contour-tracing simulation, not a recording of real brush strokes. Vietnamese male narration depends on the offline TTS voice installed on the phone.
          files: projects/storydraw-ai-local/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
