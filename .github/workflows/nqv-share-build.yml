name: NQV Share Android APK

on:
  push:
    paths:
      - "NQV-Share-project.zip.b64.05.4e"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct NQV Share project archive
        run: |
          cat NQV-Share-project.zip.b64.0* | base64 --decode > NQV-Share-project.zip
          unzip -t NQV-Share-project.zip
          mkdir -p /tmp/nqv-share
          unzip -q NQV-Share-project.zip -d /tmp/nqv-share
          test -d /tmp/nqv-share/NQV-Share/android
          rm -rf NQV-Share
          cp -a /tmp/nqv-share/NQV-Share ./NQV-Share
          rm -rf NQV-Share/.github
          git rm -f NQV-Share-project.zip.b64.* 
          git add NQV-Share NQV-Share-project.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "Add NQV Share Android and Cloudflare source"
            git push
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | sdkmanager --licenses

      - name: Install Android platform 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK on GitHub
        working-directory: NQV-Share/android
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NQV-Share-debug-apk
          path: NQV-Share/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
